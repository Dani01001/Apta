<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restaurante No Disponible</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #ff9d9d6d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        .aviso {
            background: #fff;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center;
        }
        .aviso h1 {
            color: #d32f2f;
            margin-bottom: 16px;
            font-size: 2rem;
        }
        .aviso p {
            color: #000000ff;
            font-size: 1.3rem;
        }
    </style>
</head>
<body>
    <div class="aviso">
        <h1>Apartado no disponible</h1>
        <p>Este apartado es solo para los administradores.<br>¡Si tu eres uno cnotactanos!</p>
    </div>
</body>
</html>
