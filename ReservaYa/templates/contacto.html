{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Apta | ReservaYa</title>
    <link rel="icon" href="{% static 'IMG/logo 2.png' %}" type="image/x-icon">
    <style>
        :root{
            --bg:#1a0d0d;
            --card:#240f10;
            --muted:#d6b3b3;
            --accent:#c0392b;
            --accent-2:#e74c3c;
            --radius:12px;
            --maxw:800px;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }

        *{box-sizing:border-box; margin:0; padding:0;}
        body{background:var(--bg); color:var(--muted); line-height:1.6;}
        a{text-decoration:none; color:var(--muted);}
        a:hover{color:var(--accent-2);}

        .container{
            max-width:var(--maxw);
            margin:50px auto;
            padding:30px;
            background:var(--card);
            border-radius:var(--radius);
            box-shadow:0 6px 20px rgba(192,57,43,0.35);
            text-align:center;
        }

        h1{color:var(--accent-2); margin-bottom:20px;}
        p{margin-bottom:30px; font-size:1.1rem;}

        .contact-links{
            display:flex;
            justify-content:center;
            gap:40px;
            flex-wrap:wrap;
        }

        .contact-item{
            display:flex;
            align-items:center;
            gap:12px;
            background:rgba(255,255,255,0.02);
            padding:15px 20px;
            border-radius:var(--radius);
            transition:background 0.2s ease;
        }

        .contact-item:hover{background:rgba(231,76,60,0.12);}

        .contact-item img{
            width:32px;
            height:32px;
        }

        /* Responsive */
        @media(max-width:500px){
            .contact-links{flex-direction:column; gap:20px;}
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contacto</h1>
        <p>Puede comunicarse con nosotros en cualquiera de estos medios. Haremos todo lo posible para responderle rápidamente.</p>

        <div class="contact-links">
            <!-- WhatsApp -->
            <a class="contact-item" href="https://api.whatsapp.com/send?phone=+595994791593&text=Hola,%20quiero%20hablar%20con%20ustedes" target="_blank">
                <img src="https://img.freepik.com/psd-gratis/whatsapp-icono-aislado-3d-render-ilustracion_47987-9785.jpg?semt=ais_hybrid&w=740&q=80" alt="WhatsApp">
                <span>0994 791593</span>
            </a>

            <!-- Gmail -->
            <a class="contact-item" href="mailto:reservaya010@gmail.com?subject=Contacto%20ReservaYa&body=Hola,%20quiero%20hablar%20con%20ustedes" target="_blank">
                <img src="https://pikaso.cdnpk.net/private/production/2505318411/render.png?token=exp=1783641600~hmac=f741e74dbf36e1682a46a733a5237d398373e9f36ab5891c034630dd0823b15f" alt="Correo">
                <span>reservaya010@gmail.com</span>
            </a>
        </div>
    </div>
</body>
</html>
