{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - ReservaYa</title>
    <link rel="stylesheet" href="{% static 'CSS/registro.css' %}">
</head>
<body>
    <div class="container-registro">
        <form id="formSignup" class="registro" method="POST">
            {% csrf_token %}
            <h2>Registro de Usuario</h2>

            <div class="form_input">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form_input">
                <label for="email">Correo:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form_input">
                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" name="telefono" required>
            </div>

            <div class="form_input">
                <label for="password1">Contraseña:</label>
                <input type="password" id="password1" name="password1" required>
            </div>

            <div class="form_input">
                <label for="password2">Confirmar Contraseña:</label>
                <input type="password" id="password2" name="password2" required>
            </div>

            <div class="form_input">
                <button type="submit">Registrarse</button>
            </div>

            <div class="container-otros">
                <a href="{% provider_login_url 'google' %}" class="google-login-btn">
                    <img src="https://i.blogs.es/dc6737/unnamed/650_1200.png" alt="google icon">
                    Iniciar con Google
                </a>
            </div>
            <a href="{% url 'usuarios:login' %}" class="link-login">¿Ya tienes una cuenta? Inicia aquí</a>
        </form>
    </div>
</body>
</html>
