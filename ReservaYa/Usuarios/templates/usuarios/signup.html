{% load static %}
{% load socialaccount %}
<form id="formSignup" class="signup" method="POST">
  {% csrf_token %}
  <h2>Registro de Usuario</h2>

  <div class="form_input">
    <label for="username">Usuario:</label>
    <input type="text" id="username" name="username" required>
  </div>

  <div class="form_input">
    <label for="email">Correo:</label>
    <input type="email" id="email" name="email" required>
  </div>
  <div class="form_input">
    <label for="telefono">Telefono:</label>
    <input type="telefono" id="telefono" name="telefono" required>
  </div>

  <div class="form_input">
    <label for="password1">Contraseña:</label>
    <input type="password" id="password1" name="password1" required>
  </div>

  <div class="form_input">
    <label for="password2">Confirmar Contraseña:</label>
    <input type="password" id="password2" name="password2" required>
  </div>

  <div class="form_input">
    <button type="submit">Registrarse</button>
  </div>
  <div class="container-otros">
      <a href="{% provider_login_url 'google' %}" class="google-login-btn">
          <img src="https://i.blogs.es/dc6737/unnamed/650_1200.png" alt="google icon" style=" width:50px; height:auto;">
          Iniciar con Google
      </a>
  </div>
</form>
<a href="{% url 'usuarios:login' %}" class="link-login">¿Ya tienes una cuenta? Inicia aquí</a>
