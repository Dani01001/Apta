{% extends "base.html" %}
{% load socialaccount %}
{% block title %}Registro{% endblock %}

{% block content %}
<h2>Crear cuenta</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Registrarse</button>
</form>

<hr>
<p>O regístrate con:</p>
<a href="{% provider_login_url 'google' %}">Google</a>
{% endblock %}
