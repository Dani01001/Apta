{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<h2>Acceso</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Entrar</button>
</form>

<hr>
<p>O accede con:</p>
<a href="{% provider_login_url 'google' %}">Google</a>
{% endblock %}
