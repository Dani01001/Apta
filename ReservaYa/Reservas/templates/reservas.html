{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservas</title>
<link rel="stylesheet" href="{% static 'CSS/reservas.css' %}">
<style>
/* Mensajes de error y éxito */
#mensaje-reserva {
    margin-top: 10px;
    padding: 10px;
    border-radius: 5px;
    font-weight: bold;
    transition: all 0.3s ease;
}
#mensaje-reserva.error {
    background-color: #ffe6e6;
    color: #d8000c;
    border: 1px solid #d8000c;
}
#mensaje-reserva.success {
    background-color: #e6ffe6;
    color: #4f8a10;
    border: 1px solid #4f8a10;
}
</style>
</head>
<body>
<main>
    <div class="container-prin">
        <div class="reserva">
            <h2>Reserva tu mesa</h2>
            <form id="formReserva">
                <!-- Restaurante oculto, se envía automáticamente -->
                <input type="hidden" id="restaurante" name="restaurante" value="{{ restaurante_id }}">

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre_cliente" required>

                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" name="fecha" required>

                <label for="hora">Hora:</label>
                <input type="time" id="hora" name="hora" required>

                <label for="duracion">Duración (horas):</label>
                <input type="number" id="duracion" name="duracion_horas" min="0.5" max="3" step="0.5" value="1" required>

                <label for="personas">Cantidad de personas:</label>
                <input type="number" id="personas" name="cantidad_personas" min="1" max="5" required>

                <input type="submit" value="Reservar">
            </form>
            <div id="mensaje-reserva"></div>
        </div>
    </div>
</main>

<script src="{% static 'JS/reservas.js' %}"></script>
</body>
</html>
